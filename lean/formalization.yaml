status:
  scope: The six compared declarations are Theorems 1.1(a), 1.1(b), 1.1 (k = 40), 1.2, 1.2 (orders 40, 44, 48, 50), and 1.3. All six—and all 66 declarations of the full release, including both quoted background theorems (Seymour–Tutte 6-flow Theorem 1.4 and Jaeger–Linial–Payan–Tarsi well-colouring Theorem 3.8)—are proved from Lean's three standard axioms alone, with zero custom axioms and zero external hypotheses.
