fidelity:
  divergences: All six compared statements match Theorems 1.1, 1.2, and 1.3 of the paper verbatim on finite oriented multigraphs (loops and parallel edges permitted). Theorem 1.1(b) assumes looplessness as in the paper; Theorems 1.1(a), 1.2, and 1.3 allow loops.
review:
