version: v0.4
project:
  name: "The Esperet–Hendrey–Lagoutte–Marseloo–Norin–Steiner (2025) flow reconfiguration problem: a positive answer (k = 40)"
  description: "Unconditional Lean 4 formalization of Theorems 1.1–1.3 (and all supporting lemmas and remarks) of \"The Esperet–Hendrey–Lagoutte–Marseloo–Norin–Steiner (2025) flow reconfiguration problem: a positive answer (k = 40)\": the integer flow reconfiguration graph I_k(G) (loopless) and modular graph M_k(G) (loops allowed) are connected for every finite bridgeless multigraph G whenever k is a positive multiple of 40, 48, or 66 (in particular k = 40, resolving Problem 1.2 of Esperet et al. 2025), and F(G, Γ) is connected for every non-cyclic-prime-power finite abelian group Γ whose order has a divisor 4 <= d <= |Γ|/10 (lowering the smallest known universal group order from 256 to 40). Both quoted background results (Seymour–Tutte 6-flow Theorem 1.4 and Jaeger–Linial–Payan–Tarsi well-colouring Theorem 3.8) are proved from scratch from Lean's three standard axioms alone."
